# This is a Databricks asset bundle definition for poc_databricks_evalueserve.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: poc_databricks_evalueserve
  uuid: 84affba7-d507-4c16-b548-8bc783726643

include:
  - "./resources/variables.yml"
  - "./resources/schema.yml"
  - "./resources/volume.yml"
  - "./resources/jobs/full_execution.job.yml"
  - "./resources/jobs/cen_generation.job.yml"
  - "./resources/pipeline/*"


artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog name

  resource_bronze_schema:
    description: resource bronze schema
  resource_silver_schema:
    description: resource silver schema
  resource_gold_schema:
    description: resource silver gold
  conglomerate_bronze_schema:
    description: conglomerate bronze schema
  conglomerate_silver_schema:
    description: conglomerate silver schema
  conglomerate_gold_schema:
    description: conglomerate silver gold


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-54b27bae-2e91.cloud.databricks.com
    variables:
      catalog: ${var.dev_catalog}

      resource_bronze_schema: ${var.dev_renewable_bronze_schema}
      resource_silver_schema: ${var.dev_renewable_silver_schema}
      resource_gold_schema: ${var.dev_renewable_gold_schema}
      conglomerate_bronze_schema: ${var.dev_conglomerate_bronze_schema}
      conglomerate_silver_schema: ${var.dev_conglomerate_silver_schema}
      conglomerate_gold_schema: ${var.dev_conglomerate_gold_schema}

  prod:
    mode: production
    workspace:
      host: https://dbc-54b27bae-2e91.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/andres.lagos@evalueserve.com to make sure we only have a single copy.
      root_path: /Workspace/Users/andres.lagos@evalueserve.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ${var.prod_catalog}
      resource_bronze_schema: ${var.prod_renewable_bronze_schema}
      resource_silver_schema: ${var.prod_renewable_silver_schema}
      resource_gold_schema: ${var.prod_renewable_gold_schema}
      conglomerate_bronze_schema: ${var.prod_conglomerate_bronze_schema}
      conglomerate_silver_schema: ${var.prod_conglomerate_silver_schema}
      conglomerate_gold_schema: ${var.prod_conglomerate_gold_schema}

    permissions:
      - user_name: andres.lagos@evalueserve.com
        level: CAN_MANAGE
