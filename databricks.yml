# This is a Databricks asset bundle definition for poc_databricks_evalueserve.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: poc_databricks_evalueserve
  uuid: 84affba7-d507-4c16-b548-8bc783726643

include:
  - "./resources/pipeline/renewables_energy_chile_etl.pipeline.yml"
  - "./resources/variables.yml"  

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-54b27bae-2e91.cloud.databricks.com
    variables:
      catalog: ${var.dev_catalog}
      schema: ${var.dev_schema}
  prod:
    mode: production
    workspace:
      host: https://dbc-54b27bae-2e91.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/andres.lagos@evalueserve.com to make sure we only have a single copy.
      root_path: /Workspace/Users/andres.lagos@evalueserve.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ${var.dev_catalog}
      schema: ${var.prod_schema}
    permissions:
      - user_name: andres.lagos@evalueserve.com
        level: CAN_MANAGE
