resources:
  pipelines:
    renewable_conglomerate:
      name: renewable_conglomerate
      catalog: ${var.catalog}
      schema:  ${var.conglomerate_schema}
      serverless: true
      root_path: "../../src/renewable_conglomerate_energy/transformations"
      libraries:
        - glob:
            include: ../../src/renewable_conglomerate_energy/transformations/**
      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
      configuration:
        catalog: ${var.catalog}
        schema: ${var.conglomerate_schema}