resources:
  pipelines:
    renewable_energy_chile:
      name: renewable_energy_chile
      catalog: ${var.catalog}

      schema: ${var.resource_bronze_schema}

      serverless: true
      root_path: "../../src/renewable_energy_chile/transformations"
      libraries:
        - glob:
            include: ../../src/renewable_energy_chile/transformations/**
        - glob:
            include: ../../tests/integration_test/integration_renewable_energy
      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.resource_bronze_schema}
        silver_schema: ${var.resource_silver_schema}
        gold_schema: ${var.resource_gold_schema}

