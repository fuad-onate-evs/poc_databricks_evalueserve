resources:
  pipelines:
    renewable_energy_chile:
      name: renewable_energy_chile
      catalog: ${var.catalog}
      schema: ${var.bronze_resource_schema}
      serverless: true
      root_path: "../../src/renewable_energy_chile/transformations"
      libraries:
        - glob:
            include: ../../src/renewable_energy_chile/transformations/**
      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_resource_schema}
        silver_schema: ${var.silver_resource_schema}
        gold_schema: ${var.gold_resource_schema}

