variables:

  ##############################################################
  ## Global variables
  ##############################################################
  

  ###############################################################
  # Dev variables
  ###############################################################

  dev_catalog:
    description: development environment catalog name
    default: dev

  dev_conglomerate_schema:
    description: schema name conglomerate domain
    default: dev_${workspace.current_user.short_name}_bronze_conglomerate_energy

  dev_renewable_bronze_schema:
    description: schema name bronze resource domain
    default: dev_${workspace.current_user.short_name}_bronze_renewable_energy_chile

  dev_renewable_silver_schema:
    description: schema name bronze resource domain
    default: dev_${workspace.current_user.short_name}_silver_renewable_energy_chile

  dev_renewable_gold_schema:
    description: schema name bronze resource domain
    default: dev_${workspace.current_user.short_name}_gold_renewable_energy_chile

  ###############################################################
  # prod variables
  ###############################################################

  prod_catalog:
    description: catalog name
    default: prod

  prod_conglomerate_schema:
    description: schema name
    default: bronze_conglomerate_energy

  prod_renewable_bronze_schema:
    description: schema name bronze resource domain
    default: bronze_renewable_energy_chile

  prod_renewable_silver_schema:
    description: schema name bronze resource domain
    default: silver_renewable_energy_chile

  prod_renewable_gold_schema:
    description: schema name bronze resource domain
    default: gold_renewable_energy_chile