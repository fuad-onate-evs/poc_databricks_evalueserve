variables:

  ##############################################################
  ## Global variables
  ##############################################################

  receiver_email:
    description: email address to be notified
    default: andres.lagos@evalueserve.com

  ###############################################################
  # prod variables
  ###############################################################

  prod_catalog:
    description: catalog name
    default: prod

  prod_conglomerate_bronze_schema:
    description: schema name conglomerate domain bronze
    default: conglomerate_bronze_energy_chile

  prod_conglomerate_silver_schema:
    description: schema name conglomerate domain silver
    default: conglomerate_silver_energy_chile

  prod_conglomerate_gold_schema:
    description: schema name conglomerate domain gold
    default: conglomerate_gold_energy

  prod_renewable_bronze_schema:
    description: schema name bronze resource domain
    default: renewable_bronze_energy_chile

  prod_renewable_silver_schema:
    description: schema name bronze resource domain
    default: renewable_silver_energy_chile

  prod_renewable_gold_schema:
    description: schema name bronze resource domain
    default: renewable_gold_energy_chile

  ###############################################################
  # Dev variables
  ###############################################################

  dev_catalog:
    description: development environment catalog name
    default: dev

  dev_conglomerate_bronze_schema:
    description: schema name conglomerate domain bronze
    default: dev_${workspace.current_user.short_name}_${var.prod_conglomerate_bronze_schema}

  dev_conglomerate_silver_schema:
    description: schema name conglomerate domain silver
    default: dev_${workspace.current_user.short_name}_${var.prod_conglomerate_silver_schema}

  dev_conglomerate_gold_schema:
    description: schema name conglomerate domain gold
    default: dev_${workspace.current_user.short_name}_${var.prod_conglomerate_gold_schema}

  dev_renewable_bronze_schema:
    description: schema name bronze resource domain
    default: dev_${workspace.current_user.short_name}_${var.prod_renewable_bronze_schema}

  dev_renewable_silver_schema:
    description: schema name bronze resource domain
    default: dev_${workspace.current_user.short_name}_${var.prod_renewable_silver_schema}

  dev_renewable_gold_schema:
    description: schema name bronze resource domain
    default: dev_${workspace.current_user.short_name}_${var.prod_renewable_gold_schema}

  warehouse_id:
    description: SQL warehouse backing the AI/BI dashboard
    default: 8aa88b3454673491
