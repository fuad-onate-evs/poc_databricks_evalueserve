resources:
  jobs:

    full_execution:
      name: full_execution

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      email_notifications:
        on_failure:
          - ${var.receiver_email}

      tasks:
        - task_key: pipeline_conglomerate
          pipeline_task:
            pipeline_id: ${resources.pipelines.renewable_conglomerate.id}
        - task_key: pipeline_energy_chile
          #this should be in parallel
          depends_on:
            - task_key: pipeline_conglomerate
          pipeline_task:
            pipeline_id: ${resources.pipelines.renewable_energy_chile.id}